build:
  dockerBuildPath: . # Explicitly set build context to the root directory
startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - obsidianSheetPlusApiKey
      - obsidianSheetPlusBaseUrl
    properties:
      obsidianSheetPlusApiKey:
        type: string
        description: The API key generated by the Obsidian Sheet Plus plugin.
      obsidianSheetPlusBaseUrl:
        type: string
        format: uri # Ensure it's a valid URL format
        description: The base URL of your Obsidian Sheet Plus plugin (e.g., http://127.0.0.1:27123).
  commandFunction: |
    (config) => ({
      command: 'npx',
      args: ['obsidian-sheet-plus-mcp-server'],
      env: { 
        OBSIDIAN_SHEET_PLUS_API_KEY: config.obsidianSheetPlusApiKey,
        OBSIDIAN_SHEET_PLUS_BASE_URL: config.obsidianSheetPlusBaseUrl,
        OBSIDIAN_SHEET_PLUS_VERIFY_SSL: "false"
      }
    })
